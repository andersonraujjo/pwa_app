<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12208F">
  <title>Sem conexão — UniApp</title>
  <style>
    :root { --navy: #12208F; --navy-dark: #0A1466; --bg: #EEF0F8; --ink: #161A36; --muted: #5C678F; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: Poppins, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
    }
    .card {
      width: min(360px, 100%); background: #fff; border-radius: 16px;
      border-bottom: 3px solid var(--navy-dark); box-shadow: 0 8px 22px rgba(18,32,143,.08);
      padding: 28px 20px; text-align: center;
    }
    .logo { margin: 0 0 8px; font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: var(--navy); }
    .logo span { color: #FFD400; }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.45; }
    a, button {
      display: inline-grid; place-items: center; min-height: 48px; padding: 0 18px;
      border: 0; border-radius: 12px; background: var(--navy); color: #fff;
      font: inherit; font-weight: 800; text-decoration: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="logo">Uni<span>App</span></p>
    <h1>Você está offline</h1>
    <p>Não há rede e esta página ainda não está no cache. Reconecte ou volte à tela inicial se o app shell já tiver sido salvo.</p>
    <button type="button" onclick="location.href='/'">Tentar novamente</button>
  </main>
</body>
</html>
